# ============================================================
# Continuous Integration for the calculator project
#   Lab 5 - compile + JUnit 5 matrix (JDK 17 / 21)
#   Lab 6 - container image build / smoke test (superseded by Lab 7)
#   Lab 7 - multi-container build and Compose smoke test
# Triggered on every push to main and every pull request to main
# ============================================================
name: CI Calculator

# --- Trigger rules -----------------------------------------
on:
  push:
    branches: [ main ]          # run when code is pushed to main
  pull_request:
    branches: [ main ]          # run when a PR targets main

# --- Least privilege for the automatic GITHUB_TOKEN ---------
permissions:
  contents: read

# --- Job 1: compile and test on a JDK matrix (Lab 5) --------
jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest      # runner environment: Ubuntu latest

    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]        # bonus: build on JDK 17 and JDK 21 in parallel

    steps:
      # 1. Get the source code of the repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install a JDK that matches the Dockerfile toolchain (17 / 21)
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # 3. Reuse the Maven repository so repeated builds start faster
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Compile every Java source file. After the Lab 7 restructuring the
      #    Maven project lives in backend/, so every Maven call must run there.
      - name: Compile source code
        working-directory: backend
        run: mvn -B clean compile

      # 5. Run all JUnit 5 test cases (Lab 4 suite + Lab 7 API tests)
      - name: Run JUnit 5 tests
        working-directory: backend
        run: mvn -B test

  # --- Job 2: Compose build + smoke test (Lab 7) -------------
  # This job only starts when job 1 has succeeded on BOTH JDK versions, so an
  # image can never be built from a commit whose unit tests fail.
  compose:
    name: Compose build and smoke test
    runs-on: ubuntu-latest       # the ubuntu runner ships with Docker + Compose v2
    needs: build

    permissions:
      contents: write            # to commit the screenshots produced below

    steps:
      # 1. Full repository checkout: compose needs backend/ and web/
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Validate both Dockerfiles and the compose file, and build both images.
      #    A YAML indentation error or a bad build context fails here, before the
      #    commit can reach main.
      - name: Validate and build the images (docker compose build)
        run: docker compose build

      # 3. Start the stack. --wait blocks until both healthchecks report healthy,
      #    so the next steps never race against a container that is still booting.
      - name: Start the stack (docker compose up)
        run: docker compose up -d --wait

      # 4. Show the two running containers and their published ports.
      - name: Show container status (docker compose ps)
        run: docker compose ps

      # 5. Business-level checks through the published ports:
      #    - the static page is served by nginx
      #    - /api is proxied by nginx to the backend service name
      #    - the backend also answers directly on 8000
      - name: Smoke test the frontend and the API
        run: |
          set -e
          echo "--- web page (through nginx :8080) ---"
          curl -fsS http://127.0.0.1:8080/ | grep -q "Calculator" && echo "OK: page served"
          echo "--- health through nginx ---"
          curl -fsS http://127.0.0.1:8080/health
          echo
          echo "--- calculation through nginx (proxy -> backend:8000) ---"
          curl -fsS "http://127.0.0.1:8080/api/calc?a=12&op=%2A&b=7"
          echo
          echo "--- backend directly (published port 8000) ---"
          curl -fsS "http://127.0.0.1:8000/api/calc?a=10&op=/&b=4"
          echo
          echo "--- division by zero must be a 400, not 200 ---"
          code=$(curl -s -o /tmp/zero.json -w '%{http_code}' "http://127.0.0.1:8080/api/calc?a=10&op=/&b=0")
          cat /tmp/zero.json
          echo
          test "$code" = "400" || { echo "::error::expected 400, got $code"; exit 1; }
          echo "OK: division by zero rejected with HTTP $code"

      # 6. Logs of both services (evidence of the service-name traffic).
      - name: Show service logs (docker compose logs)
        run: docker compose logs --no-color

      # 7. Browser screenshots taken INSIDE the runner, against the real stack:
      #    the page is served by the web container and every calculation is
      #    computed by the backend container.
      - name: Capture browser screenshots
        run: |
          python3 -m pip install --quiet playwright
          python3 scripts/capture_compose.py

      # 8. Keep the screenshots as a downloadable artifact ...
      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab7-screenshots
          path: docs/shots/lab7-*.png
          if-no-files-found: error

      # 9. ... and commit them back so the repository keeps the evidence.
      #    The [skip ci] marker prevents this commit from re-triggering the workflow.
      - name: Commit screenshots back to the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shots
          if git diff --cached --quiet; then
            echo "no screenshot changes to commit"
          else
            git commit -m "ci: refresh Lab 7 compose screenshots [skip ci]"
            git push
          fi

      # 10. Always tear the stack down, even when an earlier step failed.
      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v
