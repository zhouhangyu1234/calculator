# ============================================================
# Lab 5 - Continuous Integration pipeline for the calculator
# Triggered on every push to main and every pull request to main
# ============================================================
name: CI Calculator

# --- Trigger rules -----------------------------------------
on:
  push:
    branches: [ main ]          # run when code is pushed to main
  pull_request:
    branches: [ main ]          # run when a PR targets main

# --- One job, executed on a JDK matrix (Lab5 bonus task) ---
jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest      # runner environment: Ubuntu latest

    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21 ]        # bonus: build on JDK 17 and JDK 21 in parallel

    steps:
      # 1. Get the source code of the repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install a JDK that matches the local development environment (17)
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # 3. Reuse the local Maven repository so repeated builds start faster
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Compile every Java source file
      - name: Compile source code
        run: mvn clean compile

      # 5. Run all JUnit 5 test cases written in Lab 4
      - name: Run JUnit 5 tests
        run: mvn test
